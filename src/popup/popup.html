<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片真实性检测</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="popup-title">🛡 图片真实性检测</h1>
    <div id="status-area">
      <div class="status-item">
        <span class="status-label">扩展状态</span>
        <label class="toggle">
          <input type="checkbox" id="toggle-enabled">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
    <div id="summary-area" class="summary-box">
      <p class="summary-empty">当前页面暂无分析数据</p>
    </div>
    <button id="open-workbench" style="width:100%;margin-top:12px;padding:9px;border:0;border-radius:6px;color:#fff;background:#2563eb;cursor:pointer">打开图片来源工作台</button>
    <div class="popup-footer">
      <a href="#" id="open-options">设置</a>
      <span class="version"></span>
    </div>
  </div>
  <script src="../shared/contracts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
