<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片来源工作台</title><link rel="stylesheet" href="workbench.css"></head>
<body>
 <header><div><h1>图片来源工作台</h1><p>本地分析，保留每条判断依据。</p></div><a id="open-settings" href="../options/options.html" target="_blank" rel="noopener">设置</a></header>
 <p class="notice">图片不上传检测服务。模型可能误判，绿色也不证明图片真实。</p>
 <p id="status" role="status" aria-live="polite">选择本地图片，或在网页图片上右键开始。</p>
 <main>
  <section class="tasks" aria-label="待检测图片">
   <label id="drop-zone" tabindex="0"><strong>将图片拖到这里</strong><span>或选择图片文件，单图最多 40MB</span><input id="files" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp" multiple></label>
   <label class="hint" for="source-tab">选择网页（侧栏可直接使用当前网页）</label><select id="source-tab" aria-label="要读取的网页"><option value="">当前活动网页</option></select>
   <button id="collect-page" class="secondary">列出网页图片</button>
   <p class="hint">仅列出已加载的图片，最多 50 张；点击开始后才分析。</p>
   <div class="toolbar"><button id="start">开始检测</button><button id="stop" class="secondary" disabled>停止后续</button><button id="clear" class="quiet">清空</button></div>
   <div id="progress" aria-live="polite">0 张图片</div>
   <ul id="task-list" aria-label="图片检测列表"></ul>
   <section class="export" aria-label="报告导出"><h2>导出本次结果</h2><label><input id="include-urls" type="checkbox">包含网页图片 URL（可能含私密参数）</label><div class="toolbar"><button id="export-json" class="secondary">JSON</button><button id="export-csv" class="secondary">CSV</button></div><p class="hint">默认不含 URL，不导出图片像素或原始提示词。结果只保存在本页内存，关闭页面后不保留。</p></section>
  </section>
  <section id="evidence" class="evidence" aria-label="来源证据"><h2>先选择一张图片</h2><p class="muted">完成检测后，在左侧或上方列表选择结果。这里会分别说明模型估计、文件来源自述和签名核验。</p></section>
 </main>
 <footer><span id="version"></span><span>辅助查看来源线索，不作真实性鉴定。</span></footer>
 <script src="../shared/contracts.js"></script><script src="../shared/scoring.js"></script><script src="../shared/workbench.js"></script><script src="workbench.js"></script>
</body>
</html>
